services:
  - type: web
    name: soccer-stats-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev --omit=peer --no-audit && npm run check && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
        scope: run_and_build
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: API_ORIGINS
        value: https://localhost,capacitor://localhost
      - key: PORT
        value: 10000
