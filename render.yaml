services:
  - type: web
    name: soccer-stats-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev --no-audit && npm run check && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
        scope: run_and_build
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: API_ORIGINS
        value: https://localhost,capacitor://localhost
      - key: PORT
        value: 10000
      - key: APP_PUBLIC_BASE_URL
        value: https://soccer-stats-api.onrender.com
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "465"
      - key: EMAIL_SECURE
        value: "true"
      - key: EMAIL_FORCE_IPV4
        value: "true"
      - key: EMAIL_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
