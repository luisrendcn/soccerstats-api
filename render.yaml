services:
  - type: web
    name: soccer-stats-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev --no-audit && npm run check && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
        scope: run_and_build
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: API_ORIGINS
        value: https://localhost,capacitor://localhost
      - key: PORT
        value: 10000
      - key: APP_PUBLIC_BASE_URL
        value: https://soccer-stats-api.onrender.com
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: MAILGUN_FROM
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
